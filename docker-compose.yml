services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wholesale_ledger
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: wholesale_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale -d wholesale_ledger"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://wholesale:wholesale_secret@db:5432/wholesale_ledger
      SECRET_KEY: change-me-in-production-use-long-random-string
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:1008,http://127.0.0.1:1008
      OWNER_USERNAME: owner
      OWNER_PASSWORD: Wholesale@2026
      OWNER_EMAIL: owner@wholesale.local
      WHATSAPP_LOCAL_GATEWAY_URL: http://whatsapp-sender:3000/whatsapp/api/send-pdf
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "1008:80"
    depends_on:
      - backend
      - whatsapp-sender

  whatsapp-sender:
    build:
      context: ./message-sender
      dockerfile: Dockerfile
    volumes:
      - ./message-sender:/app
      - /app/node_modules
    environment:
      - PORT=3000
    restart: always

volumes:
  postgres_data:
  media_data:
